name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Database tests fail instead of skipping when Postgres is missing.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Create database roles and databases
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5433 -U postgres -f ../infra/compose/postgres-init.sql
        env:
          PGPASSWORD: postgres-ci
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
