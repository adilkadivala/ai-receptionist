# Production: one server running the api (with live calls), Postgres, a daily backup, and Caddy for HTTPS.
# docs/deploy.md walks through it. From the repository root:
#   docker compose --env-file apps/server/.env -f infra/compose/prod.yml up -d --build
# --env-file fills in the ${...} below; only the api gets the whole file as its environment.
name: receptionist

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

x-server: &server
  build: ../../apps/server
  image: receptionist-server
  env_file: ../../apps/server/.env
  environment:
    DATABASE_URL: postgresql+psycopg://receptionist_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in apps/server/.env}@postgres:5432/receptionist
    MIGRATION_DATABASE_URL: postgresql+psycopg://receptionist_owner:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in apps/server/.env}@postgres:5432/receptionist
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in apps/server/.env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init-prod.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receptionist"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # Brings the tables up to date, then exits. The api starts only once it has succeeded.
  migrate:
    <<: *server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Not public: Caddy is the way in. On the server itself (or through `ssh -L 8000:localhost:8000`) it answers on
    # localhost:8000, which is how the browser test call is reached; through Caddy that page is hidden.
    ports: ["127.0.0.1:8000:8000"]
    # A deploy restarts the api, which cuts calls in progress: deploy when the line is quiet.
    stop_grace_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in apps/server/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  # A compressed dump of the database every day, the last 14 kept in the backups volume. They're on the same disk as
  # the database, so they undo mistakes, not a lost server: copy them off it too (docs/deploy.md).
  backup:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h postgres -U postgres receptionist | gzip > /backups/receptionist-$$(date +%F).sql.gz \
            && find /backups -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
